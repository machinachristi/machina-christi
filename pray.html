  <!-- The one prayer page a card leads to — fetch it while the list is read. -->
  <link rel="prefetch" href="prayer.html" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #0b0a08;
      --gold:      #c9a227;
      --gold-soft: #e8d5a3;
      --marian:    138, 170, 222;  /* Pray — Marian blue */
      --serif:     "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
      /* The serif above has no Thai glyphs; these are system Thai faces on
         iPhone/Mac, Android, and Windows — nothing to download. Looped faces
         come first: the small loops on letters like บ ข ภ are how Thai is
         taught, and the loopless modern style makes look-alikes harder to
         tell apart for a learner. */
      --thai:      Thonburi, "Noto Sans Thai Looped", "Noto Serif Thai", Tahoma, "Leelawadee UI", "Noto Sans Thai", sans-serif;
    }

    html, body { min-height: 100dvh; }
    body {
      background:
        radial-gradient(120% 60% at 50% 0%, rgba(var(--marian), 0.13), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      color: var(--gold-soft);
      font-family: var(--serif);
      line-height: 1.75;
      -webkit-tap-highlight-color: transparent;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background:
        radial-gradient(1.5px 1.5px at 20% 30%, rgba(232,213,163,0.28), transparent),
        radial-gradient(1px 1px at 75% 25%, rgba(232,213,163,0.2), transparent),
        radial-gradient(1.5px 1.5px at 60% 70%, rgba(232,213,163,0.24), transparent),
        radial-gradient(1px 1px at 35% 80%, rgba(232,213,163,0.16), transparent);
      opacity: 0.55;
      animation: drift 16s ease-in-out infinite alternate;
    }
    @keyframes drift { from { transform: translateY(0); } to { transform: translateY(-14px); } }

    :lang(th) { font-family: var(--thai); }

    .wrap {
      max-width: 620px;
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 24px max(56px, env(safe-area-inset-bottom));
    }

    .back {
      display: inline-block;
      font-size: 14px;
      letter-spacing: 0.2em;
      color: rgba(232, 213, 163, 0.62);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      margin-bottom: 3em;
      transition: color 0.25s ease, border-color 0.25s ease;
    }
    .back:hover, .back:focus-visible { color: var(--gold-soft); border-color: rgba(232,213,163,0.5); outline: none; }

    h1 {
      font-weight: normal;
      font-size: clamp(28px, 7vw, 38px);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--gold);
    }
    /* The same word in Thai, quietly beneath the name. */
    .subtitle {
      display: block;
      font-size: clamp(18px, 5vw, 22px);
      color: rgba(var(--marian), 0.9);
      line-height: 1.6;
    }
    /* A thin gold rule beneath the heading, like a line ruled in an old book. */
    .subtitle::after {
      content: "";
      display: block;
      width: 72px;
      height: 1px;
      margin: 0.8em 0 1.2em;
      background: linear-gradient(90deg, rgba(201,162,39,0.8), transparent);
    }
    p { margin-bottom: 1em; max-width: 62ch; color: rgba(232, 213, 163, 0.78); }

    .cards { list-style: none; display: flex; flex-direction: column; gap: 16px; margin-top: 2.2em; }
    .card {
      position: relative;
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 18px 52px 18px 24px;
      border: 1px solid rgba(201, 162, 39, 0.28);
      border-radius: 14px;
      background: rgba(201, 162, 39, 0.04);
      transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }
    .card::after {
      content: "\203A";
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-52%);
      font-size: 22px;
      color: rgba(201, 162, 39, 0.5);
      transition: color 0.3s ease;
    }
    .card:hover, .card:focus-visible {
      border-color: rgba(201, 162, 39, 0.7);
      background: rgba(201, 162, 39, 0.08);
      box-shadow: 0 0 34px -12px rgba(var(--marian), 0.4);
      outline: none;
    }
    .card:hover::after, .card:focus-visible::after { color: var(--gold-soft); }
    .card h2 {
      font-weight: normal;
      font-size: 14px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--gold-soft);
    }
    .card .th {
      display: block;
      font-size: 19px;
      line-height: 1.7;
      color: var(--gold-soft);
      margin: 0.15em 0 0.1em;
    }
    .card p { margin: 0; font-size: 15px; font-style: italic; color: rgba(232, 213, 163, 0.62); }

    .notice { font-style: italic; color: rgba(232, 213, 163, 0.6); }

    @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">&lsaquo; home</a>
    <h1>Pray</h1>
    <span class="subtitle" lang="th">ภาวนา</span>
    <p>Classic Catholic prayers in Thai and English, set side by side line by line. Read them together, see how each phrase is said, and listen in either language.</p>

    <ul class="cards" id="prayers">
      <li><p class="notice">Loading&hellip;</p></li>
    </ul>
  </div>

  <script>
    (() => {
      'use strict';

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }

      const list = document.getElementById('prayers');

      // Every prayer lives in one data file — adding a new one there is all it
      // takes for it to appear here, and on its own page.
      fetch('./pray/prayers.json')
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => {
          list.innerHTML = data.prayers.map(p => `
            <li>
              <a class="card" href="prayer.html?p=${encodeURIComponent(p.id)}">
                <h2>${escapeHtml(p.title)}</h2>
                <span class="th" lang="th">${escapeHtml(p.title_th)}</span>
                ${p.about ? `<p>${escapeHtml(p.about)}</p>` : ''}
              </a>
            </li>`).join('');
        })
        .catch(() => {
          list.innerHTML = '<li><p class="notice">The prayers couldn&rsquo;t be loaded just now &mdash; please try again in a moment.</p></li>';
        });
    })();
  </script>
</body>
</html>
