  <title>Workshop · Machina Christi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #06070c;
      --gold:      #c9a227;
      --gold-soft: #e8d5a3;
      --serif:     "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;

      /* One jewel colour per tier (rgb parts); the 3D square reads these too. */
      --hands:      226, 168, 62;   /* gold     */
      --door:       176, 48, 52;    /* ruby     */
      --house:      48, 96, 180;    /* sapphire */
      --store:      40, 136, 88;    /* emerald  */
      --messengers: 126, 82, 170;   /* amethyst */
      --watch:      28, 136, 140;   /* teal     */
      --bench:      176, 102, 48;   /* copper   */
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg); }
    body {
      color: var(--gold-soft);
      font-family: var(--serif);
      -webkit-tap-highlight-color: transparent;
    }

    /* ── The square fills the screen ──────────────────────────────
       After RepoSense (iLevyTate, MIT): nothing on screen but the square, a
       slim bar above, the tiers as lights at the left, and a card only when
       something is chosen. */
    .nave { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
    .nave canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    .nave canvas:active { cursor: grabbing; }
    .nave canvas.is-pointing { cursor: pointer; }
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(130% 95% at 50% 45%, transparent 55%, rgba(3, 4, 8, 0.55) 100%);
    }
    .nave__wait {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 46%;
      text-align: center;
      font-size: 15px;
      font-style: italic;
      color: rgba(232, 213, 163, 0.6);
      pointer-events: none;
    }
    .nave[data-ready] .nave__wait, .is-flat .nave__wait { display: none; }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 26px max(12px, env(safe-area-inset-left));
      background: linear-gradient(rgba(5, 6, 11, 0.7), transparent);
      pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }
    .icon-btn {
      display: grid;
      place-items: center;
      flex: none;
      width: 40px;
      height: 40px;
      padding: 0;
      font-family: var(--serif);
      font-size: 20px;
      line-height: 1;
      color: var(--gold-soft);
      text-decoration: none;
      background: rgba(14, 13, 19, 0.6);
      border: 1px solid rgba(255, 240, 210, 0.14);
      border-radius: 12px;
      backdrop-filter: blur(16px) saturate(1.2);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }
    .icon-btn:hover { border-color: rgba(201, 162, 39, 0.7); }
    .icon-btn:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
    h1 {
      font-weight: normal;
      font-size: 17px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #ecd28a;
      text-shadow: 0 0 18px rgba(201, 162, 39, 0.35);
    }
    .topbar__sub { font-size: 14px; font-style: italic; color: rgba(232, 213, 163, 0.62); }

    /* The tiers as a column of lights down the left edge, stacked like the
       steps themselves; only the tier being told says its name. */
    .rail {
      position: absolute;
      z-index: 3;
      left: max(6px, env(safe-area-inset-left));
      top: calc(max(10px, env(safe-area-inset-top)) + 66px);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .rail::before {
      content: "";
      position: absolute;
      left: 19px;
      top: 18px;
      bottom: 18px;
      width: 1px;
      background: linear-gradient(rgba(201, 162, 39, 0.05), rgba(201, 162, 39, 0.35), rgba(201, 162, 39, 0.05));
    }
    .rail button {
      --c: 201, 162, 39;
      position: relative;
      display: flex;
      align-items: center;
      width: 40px;
      min-height: 34px;
      padding: 0 13px;
      background: none;
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }
    .rail button::before {
      content: "";
      flex: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(var(--c), 0.9);
      border: 2px solid rgba(11, 10, 8, 0.9);
      box-shadow: 0 0 10px rgba(var(--c), 0.75);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    /* The name floats beside its light, out of the way of taps on the square. */
    .rail button span {
      position: absolute;
      left: 38px;
      font-family: var(--serif);
      font-size: 14px;
      color: var(--gold-soft);
      white-space: nowrap;
      text-shadow: 0 1px 4px #000, 0 0 12px #000;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    .rail button[aria-current="true"]::before { transform: scale(1.3); border-color: #f6e7b8; }
    .rail button[aria-current="true"] span, .rail button:hover span, .rail button:focus-visible span { opacity: 1; transform: none; }
    .rail button:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: -2px; }
    @media (max-height: 700px) { .rail button { min-height: 31px; } }

    /* Labels over the square: frosted, with a point of the tier's light. */
    .tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .tag {
      --c: 201, 162, 39;
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      line-height: 1.3;
      letter-spacing: 0.02em;
      white-space: nowrap;
      padding: 4px 12px 4px 10px;
      color: rgba(255, 246, 226, 0.94);
      background: rgba(10, 10, 16, 0.56);
      border: 1px solid rgba(var(--c), 0.42);
      border-radius: 999px;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transition: opacity 0.35s ease;
      will-change: transform;
    }
    .tag::before {
      content: "";
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgb(var(--c));
      box-shadow: 0 0 8px rgb(var(--c));
    }
    .tag.on { opacity: var(--fade, 1); }
    .tag em { font-size: 14px; color: rgba(232, 213, 163, 0.6); }
    .tag.is-sel { border-color: rgba(246, 231, 184, 0.8); box-shadow: 0 0 0 1px rgba(246, 231, 184, 0.18), 0 0 26px rgba(var(--c), 0.45); }
    .tag.is-focus { opacity: 1; outline: 2px solid var(--gold-soft); outline-offset: 2px; }

    /* A first word on how to move, then it fades for good. */
    .toast {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: calc(22px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 8px 16px;
      font-size: 14px;
      font-style: italic;
      white-space: nowrap;
      color: rgba(232, 213, 163, 0.88);
      background: rgba(14, 13, 19, 0.6);
      border: 1px solid rgba(255, 240, 210, 0.12);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
    }
    .toast.on { opacity: 1; }

    /* ── The card: what is chosen, all of it at a glance ──────────
       On a phone it rests at the foot of the screen and is sized to hold a
       whole tier without scrolling; on a wide screen, or a phone on its
       side, it stands at the right. */
    .panel {
      --c: 201, 162, 39;
      position: fixed;
      z-index: 12;
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      /* Once a card is open, reading it matters more than the square behind:
         it may rise as far as the top bar rather than ever scroll. */
      max-height: calc(100dvh - max(10px, env(safe-area-inset-bottom)) - max(10px, env(safe-area-inset-top)) - 62px);
      overflow-y: auto;
      padding: 14px 16px 15px;
      background: rgba(12, 11, 17, 0.74);
      border: 1px solid rgba(255, 240, 210, 0.13);
      border-radius: 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 24px 60px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(22px) saturate(1.25);
      animation: card-in 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .panel.is-empty { display: none; }
    @keyframes card-in { from { opacity: 0; transform: translateY(10px); } }
    @media (min-width: 920px) {
      .panel { left: auto; right: max(18px, env(safe-area-inset-right)); top: 76px; bottom: auto; width: 360px; max-height: calc(100dvh - 100px); padding: 18px 20px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .panel { left: auto; top: 58px; width: 300px; max-height: none; }
    }
    .panel__close { float: right; width: 34px; height: 34px; margin: -4px -6px 2px 10px; font-size: 18px; border-radius: 10px; }
    .eyebrow {
      display: inline-block;
      padding: 0;
      font-family: var(--serif);
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgb(var(--c));
      filter: brightness(1.45);
      background: none;
      border: none;
    }
    button.eyebrow { cursor: pointer; text-decoration: underline; text-decoration-color: rgba(232, 213, 163, 0.3); text-underline-offset: 4px; }
    .eyebrow:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
    .panel h2 { margin-top: 2px; font-weight: normal; font-size: 21px; letter-spacing: 0.05em; color: var(--gold); }
    .chip {
      display: inline-block;
      margin-top: 6px;
      padding: 1px 10px;
      font-size: 14px;
      letter-spacing: 0.06em;
      border-radius: 999px;
      border: 1px solid rgba(var(--c), 0.8);
      background: rgba(var(--c), 0.2);
    }
    .panel p { margin-top: 8px; font-size: 15px; line-height: 1.5; color: rgba(244, 232, 200, 0.92); }
    .panel .what { font-style: italic; color: rgba(232, 213, 163, 0.75); }
    .panel h3 {
      margin-top: 12px;
      font-weight: normal;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(232, 213, 163, 0.6);
    }
    .touches { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    .touches button {
      font-family: var(--serif);
      font-size: 14px;
      padding: 5px 11px;
      min-height: 32px;
      color: var(--gold-soft);
      background: rgba(var(--c), 0.16);
      border: 1px solid rgba(var(--c), 0.6);
      border-radius: 8px;
      cursor: pointer;
    }
    .touches button:hover, .touches button:focus-visible { background: rgba(var(--c), 0.34); outline: none; }

    /* ── Every column, as a plain list ─────────────────────────────
       While the square stands this list is out of sight but in the page: it
       is how a keyboard or a screen reader walks the columns. Where the
       square cannot be drawn at all, it is the page. */
    .list {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .is-flat .list {
      position: fixed;
      inset: 0;
      width: auto;
      height: auto;
      overflow-y: auto;
      clip-path: none;
      white-space: normal;
      padding: 90px 20px 40vh;
    }
    .list h2 { margin-top: 18px; font-weight: normal; }
    .list .tier-open { padding: 4px 0; font-family: var(--serif); font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); background: none; border: none; cursor: pointer; }
    .list .tier-open:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
    .list ul { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .list button {
      font-family: var(--serif);
      font-size: 15px;
      padding: 6px 12px;
      min-height: 36px;
      color: var(--gold-soft);
      background: rgba(var(--c), 0.16);
      border: 1px solid rgba(var(--c), 0.6);
      border-radius: 8px;
      cursor: pointer;
    }
    .list button[aria-pressed="true"] { background: rgba(var(--c), 0.4); }
    .is-flat .nave canvas, .is-flat .rail, .is-flat .toast { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .panel, .tag, .toast, .rail button::before, .rail button span { animation: none; transition: none; }
    }
  </style>
  <script src="/assets/telemetry.js" async></script>
  <!-- three.js is the copy Eden already ships, so a visitor who has walked
       the garden downloads nothing new here. -->
  <script type="importmap">{ "imports": { "three": "/world-app/vendor/three.module.min.js" } }</script>

<body>
  <main class="nave" aria-label="The Workshop: every tool that builds Machina Christi, as columns in a square of light">
    <canvas aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="tags" aria-hidden="true"></div>
    <p class="nave__wait">Lighting the square&hellip;</p>

    <div class="topbar">
      <a class="icon-btn" href="index.html" aria-label="Home">&lsaquo;</a>
      <div>
        <h1>Workshop</h1>
        <p class="topbar__sub">how Machina Christi is built</p>
      </div>
    </div>

    <nav class="rail" aria-label="Tiers"></nav>
    <p class="toast" aria-hidden="true">drag to turn &middot; pinch to draw near &middot; tap a light</p>

    <nav class="list" aria-label="Every tool, by tier"></nav>
    <noscript><p class="nave__wait">The Workshop needs JavaScript to light. Its story is on the <a href="about-workshop.html" style="color:inherit">About page</a>.</p></noscript>
  </main>

  <aside class="panel is-empty" aria-live="polite"></aside>

  <script>
    (() => {
      'use strict';
      const root  = document.documentElement;
      const stage = document.querySelector('.nave');
      const list  = document.querySelector('.list');
      const rail  = document.querySelector('.rail');
      const panel = document.querySelector('.panel');
      const toast = stage.querySelector('.toast');
      // Wide: the card stands at the right (a wide screen, or a phone on its side).
      const wide  = matchMedia('(min-width: 920px), (orientation: landscape) and (max-height: 500px)');
      const still = matchMedia('(prefers-reduced-motion: reduce)');
      let data = null, panes = [], byId = {}, tierById = {}, nave = null;
      // What is being told: nothing, one column, or one tier.
      let selected = null, shownTier = null;

      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      };
      const button = (cls, text, onClick) => {
        const b = el('button', cls, text);
        b.type = 'button';
        b.addEventListener('click', onClick);
        return b;
      };
      const paneButton = id => list.querySelector(`button[data-id="${id}"]`);
      const railButton = id => rail.querySelector(`button[data-tier="${id}"]`);
      const tierColour = id => getComputedStyle(root).getPropertyValue('--' + id).trim() || '201, 162, 39';

      function neighbours(id) {
        // Touching goes both ways: lit together whichever side names the link.
        const set = new Set(byId[id].touches || []);
        panes.forEach(p => { if ((p.touches || []).includes(id)) set.add(p.id); });
        set.delete(id);
        return [...set].filter(n => byId[n]);
      }

      function mark(chosen, tierId) {
        list.querySelectorAll('button[data-id]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === chosen)));
        rail.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', String(b.dataset.tier === tierId)));
      }

      function setHash(id) {
        history.replaceState(null, '', location.pathname + location.search + (id ? '#' + id : ''));
      }

      // ── The card ─────────────────────────────────────────────────
      function card(colour) {
        panel.classList.remove('is-empty');
        panel.style.setProperty('--c', colour);
        const close = button('icon-btn panel__close', '×', () => {
          // Closing the card returns the keyboard to what it was about.
          const back = selected ? paneButton(selected) : shownTier ? railButton(shownTier) : null;
          rest();
          if (back) back.focus({ preventScroll: true });
        });
        close.setAttribute('aria-label', 'Close');
        panel.replaceChildren(close);
        panel.scrollTop = 0;
      }

      function paneList(title, ids) {
        const frag = document.createDocumentFragment();
        frag.append(el('h3', null, title));
        const row = el('div', 'touches');
        ids.forEach(n => row.append(button(null, byId[n].name, () => {
          select(n);
          // The card was rebuilt under the keyboard; carry focus to the new column.
          paneButton(n).focus({ preventScroll: true });
        })));
        frag.append(row);
        return frag;
      }

      function renderTier(t) {
        card(tierColour(t.id));
        const i = data.tiers.indexOf(t);
        panel.append(el('span', 'eyebrow', `Tier ${i + 1} of ${data.tiers.length} · ${t.note}`));
        panel.append(el('h2', null, t.name));
        panel.append(el('p', null, t.story || t.note));
        panel.append(paneList('In this tier', panes.filter(p => p.tier === t.id).map(p => p.id)));
      }

      function renderPane(p) {
        const t = tierById[p.tier];
        card(tierColour(p.tier));
        panel.append(button('eyebrow', t.name, () => showTier(t.id)));
        panel.append(el('h2', null, p.name));
        panel.append(el('span', 'chip', p.status === 'live' ? 'In use today' : 'Coming in phase ' + p.phase));
        panel.append(el('p', 'what', p.what));
        panel.append(el('p', null, p.here));
        const near = neighbours(p.id);
        if (near.length) panel.append(paneList('It touches', near));
      }

      // ── What can be told ─────────────────────────────────────────
      function select(id) {
        selected = id;
        shownTier = null;
        mark(id, id ? byId[id].tier : null);
        if (!id) {
          panel.classList.add('is-empty');
          panel.replaceChildren();
          setHash(null);
          if (nave) nave.select(null);
          return;
        }
        renderPane(byId[id]);
        setHash(id);
        // The card is in place before the camera frames what it leaves open.
        if (nave) nave.select(id, neighbours(id));
      }

      function showTier(id) {
        selected = null;
        shownTier = id;
        mark(null, id);
        renderTier(tierById[id]);
        setHash(null);
        if (nave) nave.showTier(id);
      }

      function rest() {
        if (nave) nave.showTier(null);
        select(null);
      }

      // The part of the screen left open: below the top bar, past the tier
      // lights, above the card on a phone or beside it on a wide screen. The
      // square centres what it tells there.
      function bandOf(h) {
        const top = stage.querySelector('.topbar').getBoundingClientRect().bottom - 14;
        let bottom = h - 10, left = 48, right = innerWidth;
        if (!panel.classList.contains('is-empty')) {
          const p = panel.getBoundingClientRect();
          if (wide.matches) right = p.left - 8; else bottom = Math.min(bottom, p.top - 8);
        }
        return bottom - top < 120 || right - left < 160 ? null : { top, bottom, left, right };
      }

      function idFromHash() {
        try { return decodeURIComponent(location.hash.slice(1)); } catch { return ''; }
      }

      // Where the square cannot be drawn, the plain list is the page.
      function flat() {
        nave = null;
        root.classList.add('is-flat');
      }

      async function raise() {
        const timer = setTimeout(() => { if (!nave) flat(); }, 12000);
        try {
          const { createNave } = await import('./workshop/nave.js');
          if (root.classList.contains('is-flat')) return;
          nave = createNave({
            stage, data,
            canvas: stage.querySelector('canvas'),
            tagHost: stage.querySelector('.tags'),
            colourOf: tierColour,
            onPick: id => { if (id && id !== selected) select(id); else if (selected || shownTier) rest(); },
            bandOf,
            reducedMotion: still.matches,
            onLost: flat,
          });
          if (selected) nave.select(selected, neighbours(selected));
          else if (!still.matches) {
            nave.startIntro();
            setTimeout(greet, 4400);
          }
          window.__nave = nave;
        } catch (e) {
          flat();
        } finally {
          clearTimeout(timer);
        }
      }

      function greet() {
        // A first word on how to move, gone at the first touch or soon after.
        if (selected || shownTier) return;
        toast.classList.add('on');
        const hide = () => toast.classList.remove('on');
        setTimeout(hide, 6500);
        stage.addEventListener('pointerdown', hide, { once: true });
      }

      function build(d) {
        data = d;
        panes = data.panes;
        panes.forEach(p => { byId[p.id] = p; });
        data.tiers.forEach(t => {
          tierById[t.id] = t;
          const inTier = panes.filter(p => p.tier === t.id);
          if (!inTier.length) return;
          // The plain list: a heading that opens the tier, and a button for every column.
          const h = el('h2');
          const open = button('tier-open', t.name, () => showTier(t.id));
          open.dataset.tier = t.id;
          h.append(open);
          const ul = el('ul');
          ul.style.setProperty('--c', tierColour(t.id));
          inTier.forEach(p => {
            const li = el('li');
            const b = button(null, p.status === 'planned' ? `${p.name} (phase ${p.phase})` : p.name, () => { if (selected === p.id) rest(); else select(p.id); });
            b.dataset.id = p.id;
            b.setAttribute('aria-pressed', 'false');
            li.append(b);
            ul.append(li);
          });
          list.append(h, ul);
          // And its light at the left.
          const r = button(null, null, () => { if (shownTier === t.id) rest(); else showTier(t.id); });
          r.append(el('span', null, t.name));
          r.dataset.tier = t.id;
          r.style.setProperty('--c', tierColour(t.id));
          r.setAttribute('aria-current', 'false');
          r.setAttribute('aria-label', t.name);
          rail.append(r);
        });
        // A keyboard walking the (unseen) list turns the square to each column.
        list.addEventListener('focusin', e => { if (nave && e.target.matches('button[data-id]:focus-visible')) nave.focus(e.target.dataset.id); });
        list.addEventListener('focusout', () => { if (nave) nave.focus(null); });
        const fromHash = idFromHash();
        if (byId[fromHash]) select(fromHash);
        raise();
      }

      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape' || !(selected || shownTier)) return;
        const back = selected ? paneButton(selected) : railButton(shownTier);
        const inCard = panel.contains(document.activeElement) || document.activeElement === document.body;
        rest();
        if (inCard && back) back.focus({ preventScroll: true });
      });
      window.addEventListener('hashchange', () => {
        const id = idFromHash();
        if (byId[id]) { if (id !== selected) select(id); }
        else if (selected) rest();
      });
      // If the page itself has been zoomed, a pinch on the square zooms the
      // page back out rather than the camera, so no one is trapped.
      if (window.visualViewport) {
        const canvas = stage.querySelector('canvas');
        const free = () => { canvas.style.touchAction = visualViewport.scale > 1.01 ? 'pinch-zoom' : ''; };
        visualViewport.addEventListener('resize', free);
        free();
      }

      fetch('workshop/glass.json')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(build)
        .catch(() => {
          flat();
          list.append(el('p', null, 'The Workshop could not be fetched just now. Please try again in a moment.'));
        });
    })();
  </script>
</body>
</html>
