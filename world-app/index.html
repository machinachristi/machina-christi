<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#87b5df" />
  <!-- This document is the world's iframe interior; world.html is the page
       people should land on. Keep this one out of search results. -->
  <meta name="robots" content="noindex" />
  <title>The Garden of Eden</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #87b5df;               /* sky tone while three.js boots */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    canvas { display: block; touch-action: none; }

    /* The ambience toggle (created by audio.js) — a quiet pill in the
       corner, echoing the shell's "return home" styling. */
    .sound {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 10;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(201, 162, 39, 0.35);
      background: rgba(11, 10, 8, 0.4);
      color: rgba(232, 213, 163, 0.9);
      cursor: pointer;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      touch-action: manipulation;
      transition: border-color 0.25s ease, background 0.25s ease;
    }
    .sound:hover, .sound:focus-visible {
      border-color: rgba(201, 162, 39, 0.7);
      background: rgba(11, 10, 8, 0.6);
      outline: none;
    }
    .sound svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .sound .slash { display: none; }
    .sound--off .wave { display: none; }
    .sound--off .slash { display: block; }
    .sound--off { color: rgba(232, 213, 163, 0.55); }
    /* Sound is on but not yet sounding (phone wants a tap): a slow glow. */
    .sound--waiting { animation: soundWait 1.6s ease-in-out infinite; }
    @keyframes soundWait {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
      50% { box-shadow: 0 0 0 5px rgba(255, 215, 0, 0.35); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sound--waiting { animation: none; box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.35); }
    }

    /* The naming caption (created by main.js) — Genesis 2:19-20: draw near
       a creature and its name is given, a quiet line above the safe area.
       Pointer-transparent so walking is never blocked by it. */
    .naming {
      position: fixed;
      left: 50%;
      bottom: max(64px, calc(env(safe-area-inset-bottom) + 50px));
      transform: translateX(-50%) translateY(7px);
      z-index: 10;
      /* Heaven's saints carry long titles (AB#106): the line wraps, evenly,
         inside the screen's own width. */
      width: max-content;
      max-width: calc(100vw - 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.55s ease, transform 0.55s ease;
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
      text-align: center;
      text-shadow: 0 1px 12px rgba(11, 10, 8, 0.6), 0 0 3px rgba(11, 10, 8, 0.4);
    }
    .naming--shown { opacity: 1; transform: translateX(-50%) translateY(0); }
    /* Heaven is bright everywhere (AB#106): the same words, held off it by
       a deeper, warmer shadow so they stay easy to read. */
    .realm-heaven .naming {
      text-shadow: 0 1px 10px rgba(58, 40, 14, 0.9), 0 0 3px rgba(58, 40, 14, 0.75), 0 0 22px rgba(58, 40, 14, 0.45);
    }
    .naming__name,
    .naming__label {
      max-width: 100%;
      text-wrap: balance;
    }
    .naming__name {
      font-size: 21px;
      letter-spacing: 0.14em;
      text-indent: 0.14em;
      color: #e8d5a3;
    }
    .naming__label {
      font-size: 13px;
      letter-spacing: 0.24em;
      text-indent: 0.24em;
      text-transform: uppercase;
      color: rgba(232, 213, 163, 0.78);
    }

    /* The veil of light between the realms (AB#106; created by realm.js):
       warm light filling the view while he passes up or down the ladder.
       Its opacity is set from the walk itself, frame by frame; it never
       takes a touch, and it sits under the caption and the sound toggle. */
    .passage {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      background: radial-gradient(ellipse at 50% 42%, #fffdf7 0%, #fff6e3 55%, #f6e5c2 100%);
    }
    /* AB#165, stations (stations.js): a game laid over the paused garden as
       its own page, filling the screen, above everything of the garden's;
       and the veil of light that gathers before it opens and after it
       closes. This veil keeps its own time (a CSS fade), because the
       garden's frame-by-frame clock is stopped while the game is open. */
    .station {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #0b0a08;
    }
    .station[hidden] { display: none; }
    .station__frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .station-veil {
      position: fixed;
      inset: 0;
      z-index: 21;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0s linear 0.6s;
      background: radial-gradient(ellipse at 50% 42%, #fffdf7 0%, #fff6e3 55%, #f6e5c2 100%);
    }
    .station-veil--on {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.36s ease, visibility 0s;
    }
    /* AB#164, the new way of steering (controls.js): the thumb stick, drawn
       where the thumb came down on the lower part of the screen — a faint
       ring and a bead. It never takes a touch. */
    .stick {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 9;
      width: 0;
      height: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
    }
    .stick--shown { opacity: 1; }
    .stick::before {
      content: "";
      position: absolute;
      left: -62px;
      top: -62px;
      width: 124px;
      height: 124px;
      border-radius: 50%;
      border: 1.5px solid rgba(244, 230, 186, 0.5);
      background: rgba(11, 10, 8, 0.12);
      transition: border-color 0.2s ease;
    }
    .stick--quick::before { border-color: rgba(255, 215, 0, 0.85); }
    .stick__bead {
      position: absolute;
      left: -19px;
      top: -19px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(244, 230, 186, 0.55);
      box-shadow: 0 0 10px rgba(11, 10, 8, 0.35);
    }

    /* …and a line of help for the first moments of a visit (main.js). */
    .howto {
      position: fixed;
      left: 50%;
      top: max(64px, calc(env(safe-area-inset-top) + 56px));
      transform: translateX(-50%);
      z-index: 10;
      width: max-content;
      max-width: calc(100vw - 40px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: 15px;
      line-height: 1.55;
      text-align: center;
      text-wrap: balance;
      color: #f1e3b8;
      text-shadow: 0 1px 10px rgba(11, 10, 8, 0.8), 0 0 3px rgba(11, 10, 8, 0.6);
    }
    .howto--shown { opacity: 1; }
  </style>
  <script>
    // Error relay to the parent shell (world.html). Registered before the
    // module script so that even a failure to fetch/parse the app itself is
    // reported — the parent decides what the visitor sees.
    (function () {
      function report(message) {
        try {
          if (window.parent !== window) {
            window.parent.postMessage(
              { type: 'world:error', message: String(message || 'unknown error') },
              '*'
            );
          }
        } catch (_) { /* no parent — standalone visit */ }
      }
      window.addEventListener('error', function (e) { report(e.message); });
      window.addEventListener('unhandledrejection', function (e) {
        report(e.reason && e.reason.message ? e.reason.message : e.reason);
      });
    })();
  </script>
  <script type="importmap">

  </script>
  <!-- The whole module graph, declared up front. Without these hints the
       browser discovers imports one level at a time — main.js, then the
       scenes, then three.module, then three.core (the biggest file, found
       last) — a serial waterfall of round trips before the garden can boot.
       Preloading lets everything download in parallel from the first moment.
       When adding a module (a scene, a heaven piece, anything main.js reaches
       through `import`), add a line here too. Forgetting one breaks nothing
       on screen — that file just loses its head start and is fetched late,
       on discovery — which is why it slipped eight times before;
       tests/world-start.spec.js now fails until the line is here, and
       prints the exact line to add. -->
